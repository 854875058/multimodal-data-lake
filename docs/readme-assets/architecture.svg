<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">System Architecture</text>

  <!-- Frontend Layer -->
  <rect x="100" y="55" width="600" height="70" rx="8" fill="url(#box1)" opacity="0.9"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">React 18 + Arco Design</text>
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.8)">湖总览 · 湖查询 · 湖计算 · 湖存储 · 湖治理 · 湖运维 · 系统配置</text>

  <!-- Arrow down -->
  <line x1="400" y1="125" x2="400" y2="155" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.5)"/>
    </marker>
  </defs>

  <!-- Backend Layer -->
  <rect x="100" y="155" width="600" height="100" rx="8" fill="url(#box2)" opacity="0.9"/>
  <text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">FastAPI Backend</text>

  <!-- Backend modules -->
  <g font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">
    <rect x="120" y="195" width="70" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="155" y="210" text-anchor="middle">upload</text>

    <rect x="200" y="195" width="70" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="235" y="210" text-anchor="middle">search</text>

    <rect x="280" y="195" width="70" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="315" y="210" text-anchor="middle">files</text>

    <rect x="360" y="195" width="80" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="400" y="210" text-anchor="middle">dashboard</text>

    <rect x="450" y="195" width="80" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="490" y="210" text-anchor="middle">platform</text>

    <rect x="540" y="195" width="70" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="575" y="210" text-anchor="middle">operators</text>

    <rect x="120" y="225" width="70" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="155" y="240" text-anchor="middle">versions</text>

    <rect x="200" y="225" width="70" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="235" y="240" text-anchor="middle">users</text>

    <rect x="280" y="225" width="80" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="320" y="240" text-anchor="middle">permissions</text>

    <rect x="370" y="225" width="60" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="400" y="240" text-anchor="middle">ray</text>

    <rect x="440" y="225" width="60" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="470" y="240" text-anchor="middle">doris</text>

    <rect x="510" y="225" width="50" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="535" y="240" text-anchor="middle">mpp</text>

    <rect x="570" y="225" width="70" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="605" y="240" text-anchor="middle">agents</text>
  </g>

  <!-- Arrows down -->
  <line x1="300" y1="255" x2="300" y2="285" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="500" y1="255" x2="500" y2="285" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Storage Layer -->
  <rect x="100" y="285" width="280" height="120" rx="8" fill="url(#box3)" opacity="0.9"/>
  <text x="240" y="310" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Storage Layer</text>
  <g font-family="Arial" font-size="11" fill="rgba(255,255,255,0.85)">
    <text x="240" y="335" text-anchor="middle">SeaweedFS / S3 对象存储</text>
    <text x="240" y="355" text-anchor="middle">LanceDB 向量湖</text>
    <text x="240" y="375" text-anchor="middle">SQLite 元数据</text>
    <text x="240" y="395" text-anchor="middle">Doris 联邦查询</text>
  </g>

  <!-- AI / Compute Layer -->
  <rect x="420" y="285" width="280" height="120" rx="8" fill="url(#box4)" opacity="0.9"/>
  <text x="560" y="310" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">AI / Compute</text>
  <g font-family="Arial" font-size="11" fill="rgba(255,255,255,0.85)">
    <text x="560" y="335" text-anchor="middle">BGE / CLIP / Whisper</text>
    <text x="560" y="355" text-anchor="middle">DeepSeek / 本地模型</text>
    <text x="560" y="375" text-anchor="middle">Ray 分布式计算</text>
    <text x="560" y="395" text-anchor="middle">Agent Team 协作</text>
  </g>

  <!-- Connection lines -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="240" y1="405" x2="240" y2="430"/>
    <line x1="560" y1="405" x2="560" y2="430"/>
    <line x1="240" y1="430" x2="560" y2="430"/>
  </g>

  <!-- Bottom label -->
  <text x="400" y="460" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">
    start.py 单入口启动 · 前端静态资源由后端统一托管 · 默认端口 27843
  </text>
</svg>
