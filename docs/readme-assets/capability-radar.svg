<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="radarStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0a0e27" rx="12"/>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">Capability Panorama</text>

  <!-- Radar center -->
  <g transform="translate(300, 220)">
    <!-- Radar rings -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="104" y2="-60" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="104" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-104" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-104" y2="-60" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>

    <!-- Data polygon -->
    <polygon points="0,-110 95,-50 90,55 0,100 -85,50 -90,-55"
      fill="url(#radarFill)" stroke="url(#radarStroke)" stroke-width="2">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </polygon>

    <!-- Data points -->
    <circle cx="0" cy="-110" r="4" fill="#00d4ff"/>
    <circle cx="95" cy="-50" r="4" fill="#7c3aed"/>
    <circle cx="90" cy="55" r="4" fill="#f59e0b"/>
    <circle cx="0" cy="100" r="4" fill="#10b981"/>
    <circle cx="-85" cy="50" r="4" fill="#ef4444"/>
    <circle cx="-90" cy="-55" r="4" fill="#ec4899"/>

    <!-- Labels -->
    <text x="0" y="-130" text-anchor="middle" font-family="Arial" font-size="11" fill="#00d4ff">数据接入</text>
    <text x="120" y="-55" text-anchor="start" font-family="Arial" font-size="11" fill="#7c3aed">统一检索</text>
    <text x="115" y="60" text-anchor="start" font-family="Arial" font-size="11" fill="#f59e0b">工作流编排</text>
    <text x="0" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#10b981">数据治理</text>
    <text x="-115" y="55" text-anchor="end" font-family="Arial" font-size="11" fill="#ef4444">湖仓运维</text>
    <text x="-115" y="-60" text-anchor="end" font-family="Arial" font-size="11" fill="#ec4899">AI 能力</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 370)">
    <circle cx="0" cy="0" r="4" fill="#00d4ff"/>
    <text x="10" y="4" font-family="Arial" font-size="10" fill="#94a3b8">核心能力</text>
    <circle cx="80" cy="0" r="4" fill="#7c3aed"/>
    <text x="90" y="4" font-family="Arial" font-size="10" fill="#94a3b8">扩展能力</text>
  </g>
</svg>
