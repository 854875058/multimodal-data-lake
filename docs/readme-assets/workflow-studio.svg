    <rect x="20" y="140" width="4" height="45" rx="2" fill="#10b981"/>
    <text x="35" y="160" font-family="Arial" font-size="10" fill="#e2e8f0">正则隐私脱敏</text>
    <text x="35" y="175" font-family="Arial" font-size="8" fill="#64748b">处理 · CPU</text>
