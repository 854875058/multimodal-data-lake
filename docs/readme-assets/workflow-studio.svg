    <text x="35" y="105" font-family="Arial" font-size="10" fill="#e2e8f0">读取 Lance 数据</text>
    <text x="35" y="120" font-family="Arial" font-size="8" fill="#64748b">输入 · CPU</text>
  </g>

  <g filter="url(#nodeShadow)">
