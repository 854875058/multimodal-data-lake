  <rect x="660" y="410" width="30" height="10" rx="2" fill="rgba(59,130,246,0.3)" stroke="rgba(59,130,246,0.5)" stroke-width="0.5"/>
  <rect x="700" y="410" width="30" height="10" rx="2" fill="rgba(16,185,129,0.3)" stroke="rgba(16,185,129,0.5)" stroke-width="0.5"/>

  <!-- Zoom controls hint -->
