    <text x="35" y="325" font-family="Arial" font-size="10" fill="#e2e8f0">写入 Doris</text>
    <text x="35" y="340" font-family="Arial" font-size="8" fill="#64748b">输出 · CPU</text>
  </g>

  <!-- Canvas nodes -->
  <!-- Node 1: Read Lance -->
  <g filter="url(#nodeShadow)">
    <rect x="200" y="100" width="160" height="70" rx="8" fill="rgba(30,41,59,0.98)" stroke="rgba(59,130,246,0.5)" stroke-width="2"/>
    <rect x="200" y="100" width="4" height="70" rx="2" fill="url(#nodeSource)"/>
    <text x="215" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="white">读取 Lance 数据</text>
    <text x="215" y="145" font-family="Arial" font-size="9" fill="#64748b">read_lance</text>
    <circle cx="360" cy="135" r="6" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
  </g>

  <!-- Node 2: Clean Text -->
  <g filter="url(#nodeShadow)">
    <rect x="400" y="100" width="160" height="70" rx="8" fill="rgba(30,41,59,0.98)" stroke="rgba(16,185,129,0.5)" stroke-width="2"/>
    <rect x="400" y="100" width="4" height="70" rx="2" fill="url(#nodeTransform)"/>
    <circle cx="400" cy="135" r="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <text x="415" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="white">正则隐私脱敏</text>
    <text x="415" y="145" font-family="Arial" font-size="9" fill="#64748b">clean_texts_by_regex</text>
    <text x="415" y="160" font-family="Arial" font-size="8" fill="#94a3b8">chunk_size: 500</text>
    <circle cx="560" cy="135" r="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  </g>

  <!-- Node 3: Split Text -->
  <g filter="url(#nodeShadow)">
    <rect x="400" y="200" width="160" height="70" rx="8" fill="rgba(30,41,59,0.98)" stroke="rgba(16,185,129,0.5)" stroke-width="2"/>
    <rect x="400" y="200" width="4" height="70" rx="2" fill="url(#nodeTransform)"/>
    <circle cx="400" cy="235" r="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <text x="415" y="225" font-family="Arial" font-size="12" font-weight="bold" fill="white">文本按长度切分</text>
    <text x="415" y="245" font-family="Arial" font-size="9" fill="#64748b">split_text_by_length</text>
    <text x="415" y="260" font-family="Arial" font-size="8" fill="#94a3b8">chunk_size: 1000</text>
    <circle cx="560" cy="235" r="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  </g>

  <!-- Node 4: Vectorize -->
