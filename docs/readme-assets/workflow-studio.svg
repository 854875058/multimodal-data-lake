    <rect x="20" y="195" width="4" height="45" rx="2" fill="#10b981"/>
    <text x="35" y="215" font-family="Arial" font-size="10" fill="#e2e8f0">文本按长度切分</text>
    <text x="35" y="230" font-family="Arial" font-size="8" fill="#64748b">处理 · CPU</text>
  </g>

