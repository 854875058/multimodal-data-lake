    <text x="35" y="270" font-family="Arial" font-size="10" fill="#e2e8f0">文本向量化</text>
    <text x="35" y="285" font-family="Arial" font-size="8" fill="#64748b">智能 · GPU</text>
  </g>

  <g filter="url(#nodeShadow)">
    <rect x="20" y="305" width="130" height="45" rx="6" fill="rgba(30,41,59,0.95)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
