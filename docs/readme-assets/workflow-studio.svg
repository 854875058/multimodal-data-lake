    <text x="80" y="34" text-anchor="middle" fill="#e2e8f0">文本清洗流水线</text>

    <rect x="150" y="18" width="100" height="24" rx="4" fill="rgba(100,116,139,0.15)" stroke="rgba(100,116,139,0.2)" stroke-width="0.5"/>
    <text x="200" y="34" text-anchor="middle" fill="#e2e8f0">multimodal</text>

