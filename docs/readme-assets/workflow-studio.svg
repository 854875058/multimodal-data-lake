    <text x="615" y="175" font-family="Arial" font-size="12" font-weight="bold" fill="white">文本向量化</text>
    <text x="615" y="195" font-family="Arial" font-size="9" fill="#64748b">vectorize_text</text>
    <circle cx="760" cy="185" r="6" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1.5"/>
  </g>

  <!-- Edge connections -->
  <g stroke="rgba(59,130,246,0.6)" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M 360 135 C 380 135, 380 135, 400 135"/>
    <path d="M 560 135 C 580 135, 580 185, 600 185"/>
    <path d="M 560 235 C 580 235, 580 185, 600 185"/>
  </g>

  <!-- Right panel preview hint -->
