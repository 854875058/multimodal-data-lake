    <rect width="80" height="40" rx="4" fill="rgba(30,41,59,0.9)" stroke="rgba(100,116,139,0.2)" stroke-width="1"/>
    <text x="20" y="25" font-family="Arial" font-size="14" fill="#94a3b8">+</text>
    <text x="40" y="25" font-family="Arial" font-size="9" fill="#64748b">100%</text>
    <text x="65" y="25" font-family="Arial" font-size="14" fill="#94a3b8">−</text>
