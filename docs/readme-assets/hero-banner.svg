<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1234;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Floating particles -->
  <circle cx="150" cy="80" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="120" r="1.5" fill="#7c3aed" opacity="0.5">
    <animate attributeName="cy" values="120;110;120" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="60" r="2.5" fill="#00d4ff" opacity="0.4">
    <animate attributeName="cy" values="60;50;60" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="140" r="1.8" fill="#f59e0b" opacity="0.5">
    <animate attributeName="cy" values="140;130;140" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="90" r="2" fill="#7c3aed" opacity="0.6">
    <animate attributeName="cy" values="90;80;90" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="110" r="1.5" fill="#00d4ff" opacity="0.5">
    <animate attributeName="cy" values="110;100;110" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Data flow lines -->
  <g filter="url(#glow)" opacity="0.3">
    <path d="M 100 300 Q 300 200 500 250 Q 700 300 900 200" stroke="url(#accent)" stroke-width="1.5" fill="none"/>
    <path d="M 200 350 Q 400 250 600 300 Q 800 350 1000 250" stroke="url(#gold)" stroke-width="1" fill="none"/>
  </g>

  <!-- Central lake icon -->
  <g transform="translate(600, 160)">
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
    <ellipse cx="0" cy="-10" rx="60" ry="22" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="-20" rx="40" ry="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="-30" r="8" fill="#00d4ff" opacity="0.9"/>
    <!-- Ripples -->
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.2">
      <animate attributeName="rx" values="80;100;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="30;37;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" filter="url(#glow)">
    Multimodal Data Lake
  </text>

  <!-- Subtitle -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">
    企业级多模态数据湖仓智能运营平台
  </text>

  <!-- Tagline -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">
    接入 · 入湖 · 索引 · 检索 · 治理 · 编排 · 运维 · AI
  </text>

  <!-- Tech badges -->
  <g transform="translate(600, 360)">
    <rect x="-200" y="-12" width="60" height="24" rx="12" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="-170" y="4" text-anchor="middle" font-family="Arial" font-size="10" fill="#00d4ff">Python</text>

    <rect x="-120" y="-12" width="70" height="24" rx="12" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="-85" y="4" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c3aed">FastAPI</text>

    <rect x="-30" y="-12" width="60" height="24" rx="12" fill="rgba(97,218,251,0.15)" stroke="#61DAFB" stroke-width="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="10" fill="#61DAFB">React</text>

    <rect x="50" y="-12" width="60" height="24" rx="12" fill="rgba(255,107,0,0.15)" stroke="#FF6B00" stroke-width="0.5"/>
    <text x="80" y="4" text-anchor="middle" font-family="Arial" font-size="10" fill="#FF6B00">LanceDB</text>

    <rect x="130" y="-12" width="50" height="24" rx="12" fill="rgba(138,43,226,0.15)" stroke="#8A2BE2" stroke-width="0.5"/>
    <text x="155" y="4" text-anchor="middle" font-family="Arial" font-size="10" fill="#8A2BE2">Ray</text>
  </g>
</svg>
